name: Apk dex probe (release asset -> git)
on:
  workflow_dispatch:
  push:
    paths:
      - 'test-kit/apk-analysis-placeholder.md'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download dex.zip from release
        run: |
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/dex.zip https://api.github.com/repos/gulp-tech/VoidAC/releases/assets/743903251
          ls -l /tmp/dex.zip
          file /tmp/dex.zip || true
      - name: Extract and record
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/new-cheats"
          mkdir -p "$OUT"
          unzip -o -q /tmp/dex.zip -d "$OUT" || true
          find "$OUT" -type f | head -50
          ( cd "$OUT" && sha256sum * 2>/dev/null || true ) > "$OUT/SHA256.txt"
          cat "$OUT/SHA256.txt" || true
      - name: Commit
        run: |
          git config user.name "vac-bot"
          git config user.email "bot@voidpe.local"
          git add -A apk-analysis/new-cheats
          git commit -m "CI: dex.zip из релиза cheat [skip ci]" || echo "нечего коммитить"
          git push
