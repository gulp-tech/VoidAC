name: Apollon DEX extraction (static analysis input)
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/apollon-dex.yml', 'test-kit/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dex-zip:
    # Второй набор DEX: релиз `cheat` -> dex.zip. Из песочницы
    # release-assets.githubusercontent.com недоступен, поэтому качаем здесь
    # и коммитим в ветку, откуда читаем через api.github.com.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Скачать dex.zip из релиза cheat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/dex.zip \
            https://api.github.com/repos/gulp-tech/VoidAC/releases/assets/743903251
          ls -l /tmp/dex.zip
          file /tmp/dex.zip || true
          sha256sum /tmp/dex.zip || true

      - name: Распаковать и записать хэши
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/new-cheats"
          mkdir -p "$OUT"
          unzip -o -q /tmp/dex.zip -d "$OUT" || true
          echo "=== файлы ==="
          find "$OUT" -type f -printf '%s\t%p\n' | head -60
          ( cd "$OUT" && sha256sum $(find . -type f ! -name SHA256.txt) ) > "$OUT/SHA256.txt" 2>/dev/null || true
          cat "$OUT/SHA256.txt" || true

      - name: Закоммитить в ветку
        run: |
          git config user.name "vac-bot"
          git config user.email "bot@voidpe.local"
          git add -A apk-analysis/new-cheats
          if git diff --cached --quiet; then
            echo "нечего коммитить"
          else
            git commit -m "CI: dex.zip из релиза cheat [skip ci]"
            git push
          fi

  apk-latest:
    # Любой .apk из последних релизов: находим ассет по имени сами,
    # поэтому при заливке нового APK не нужно править ID.
    # Из песочницы release-assets недоступен, в Actions — доступен.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Найти последний .apk в релизах
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Перебираем релизы от новых к старым, берём ассеты .apk.
          gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq '.[] | .created_at as $c | .assets[] | select(.name|test("\\.apk$")) | "\($c)\t\(.id)\t\(.name)\t\(.size)"' \
            > /tmp/apks.txt
          cat /tmp/apks.txt || true
          LINE=$(sort -r /tmp/apks.txt | head -1)
          if [ -z "$LINE" ]; then echo "нет .apk в релизах"; exit 0; fi
          ID=$(echo "$LINE" | cut -f2); NAME=$(echo "$LINE" | cut -f3)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "выбран: $NAME (id $ID)"

      - name: Скачать APK
        if: steps.find.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/client.apk \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ steps.find.outputs.id }}"
          ls -l /tmp/client.apk
          sha256sum /tmp/client.apk
          head -c 4 /tmp/client.apk | od -An -c

      - name: Извлечь DEX, .so и манифест
        if: steps.find.outputs.id != ''
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/apk-latest"
          mkdir -p "$OUT"
          unzip -l /tmp/client.apk > "$OUT/listing.txt" 2>&1 || true
          unzip -o -q /tmp/client.apk '*.dex' 'AndroidManifest.xml' -d "$OUT" 2>/dev/null || true
          unzip -o -q /tmp/client.apk 'lib/arm64-v8a/libReverseSigma.so' -d "$OUT" 2>/dev/null || true
          echo "=== извлечено ==="
          find "$OUT" -type f -printf '%s\t%p\n' | sort -rn | head -20
          ( cd "$OUT" && sha256sum *.dex *.so 2>/dev/null ) > "$OUT/SHA256.txt" || true
          cat "$OUT/SHA256.txt" || true

      - name: Закоммитить
        if: steps.find.outputs.id != ''
        run: |
          set +e
          git config user.name "vac-bot"; git config user.email "bot@voidpe.local"
          git add -A apk-analysis/apk-latest
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -m "apk: разобран ${{ steps.find.outputs.name }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push && break
            echo "пуш $i не прошёл, повтор"; sleep 5
          done
          exit 0

  release-parts:
    # Части APK из релиза `чаавцппк`. Из песочницы release-assets
    # недоступен (302 + 0 байт), поэтому качаем в Actions и коммитим
    # листинг — сам архив для git слишком велик.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Скачать части из релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/parts
          for id in 748040301 748040667; do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o "/tmp/parts/$id.bin" \
              "https://api.github.com/repos/gulp-tech/VoidAC/releases/assets/$id"
            ls -l "/tmp/parts/$id.bin"; sha256sum "/tmp/parts/$id.bin" || true
          done

      - name: Формат и содержимое
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/release-parts"
          mkdir -p "$OUT"
          : > "$OUT/listing.txt"
          for f in /tmp/parts/*.bin; do
            echo "########## $f ##########" >> "$OUT/listing.txt"
            head -c 16 "$f" | od -An -tx1 >> "$OUT/listing.txt"
            if 7z l "$f" > /tmp/s7.txt 2>/dev/null; then
              echo "--- 7Z ok ---" >> "$OUT/listing.txt"; cat /tmp/s7.txt >> "$OUT/listing.txt"
            elif unzip -l "$f" > /tmp/z.txt 2>/dev/null; then
              echo "--- ZIP ok ---" >> "$OUT/listing.txt"; cat /tmp/z.txt >> "$OUT/listing.txt"
            else
              echo "--- НЕ zip ---" >> "$OUT/listing.txt"
              head -c 64 "$f" | od -c >> "$OUT/listing.txt"
            fi
          done
          wc -l "$OUT/listing.txt"; cat "$OUT/listing.txt" | head -60 || true

      - name: Проверить, что за файл внутри .7z
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/release-parts"
          7z x -y -o/tmp/inner "/tmp/parts/748040667.bin" > /dev/null 2>&1 || true
          f=$(find /tmp/inner -name '*.004' | head -1)
          [ -n "$f" ] || exit 0
          echo "=== .004 ===" >> "$OUT/listing.txt"
          head -c 8 "$f" | od -An -tx1 >> "$OUT/listing.txt"
          echo "sha256 = $(sha256sum "$f" | cut -d' ' -f1)" >> "$OUT/listing.txt"
          if unzip -l "$f" > /tmp/z4.txt 2>/dev/null; then
            echo "=== .004 это ZIP/APK ===" >> "$OUT/listing.txt"; cat /tmp/z4.txt >> "$OUT/listing.txt"
            unzip -o -q "$f" 'lib/arm64-v8a/*' '*.dex' -d "$OUT/inner" 2>/dev/null || true
          else
            echo "=== .004 НЕ zip — часть разрезанного архива ===" >> "$OUT/listing.txt"
          fi

      - name: Достать .so и dex
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/release-parts"
          i=0
          for f in /tmp/parts/*.bin; do
            i=$((i+1))
            7z x -y -o"$OUT/p$i" "$f" '*.apk' '*.dex' '*.so' 'lib/*' > /dev/null 2>&1 \
              || unzip -o -q "$f" 'lib/*' '*.dex' -d "$OUT/p$i" 2>/dev/null || true
            # Внутри 7z может быть APK — распаковываем и его.
            for apk in "$OUT"/p$i/*.apk; do
              [ -f "$apk" ] || continue
              unzip -o -q "$apk" 'lib/arm64-v8a/libReverseSigma.so' '*.dex' -d "$OUT/p$i/apk" 2>/dev/null || true
            done
          done
          find "$OUT" -type f -printf '%s\t%p\n' 2>/dev/null | head -30 || true
          du -sh "$OUT" || true

      - name: Закоммитить
        run: |
          set +e
          git config user.name "vac-bot"; git config user.email "bot@voidpe.local"
          git add -A apk-analysis/release-parts
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -m "CI: части релиза чаавцппк [skip ci]"
          # Параллельные job'ы тоже коммитят — подтягиваем и пробуем ещё раз.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push && break
            echo "попытка $i не удалась, повтор"; sleep 5
          done
          exit 0

  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Скачать APK Apollon (в Actions хост доступен)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in
          gh release download cheat --repo gulp-tech/Purpurbedrock \
            --pattern 'MCPE_Apollon_Client_1.26.60_v6.71_64Bit.1.apk' --dir /tmp/in
          ls -l /tmp/in
          sha256sum /tmp/in/*.apk > /tmp/in/SHA256.txt

      - name: Извлечь DEX и манифест (только чтение, ничего не запускаем)
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/apk-analysis"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cd /tmp/in
          APK=$(ls *.apk | head -1)
          # Список содержимого архива — он же диагностика, если DEX не нашлись.
          unzip -l "$APK" > /tmp/in/listing.txt || true
          # DEX могут лежать и в корне, и без classes-префикса.
          unzip -o -q "$APK" '*.dex' 'AndroidManifest.xml' -d /tmp/dex || true
          # libReverseSigma.so — единственная библиотека с датой сборки 2026
          # (остальные от 2008), в ней и живёт код клиента.
          unzip -o -q "$APK" 'lib/arm64-v8a/libReverseSigma.so' -d /tmp/native || true
          ls -l /tmp/native/lib/arm64-v8a/ 2>/dev/null || true
          ls -l /tmp/dex 2>/dev/null || true
          cp /tmp/in/listing.txt /tmp/in/SHA256.txt "$OUT"/ || true
          if ls /tmp/dex/*.dex >/dev/null 2>&1; then
            cp -v /tmp/dex/*.dex "$OUT"/ || true
            cp -v /tmp/native/lib/arm64-v8a/libReverseSigma.so "$OUT"/ || true
          else
            echo "DEX не найдены — смотри listing.txt" > "$OUT"/README.txt
          fi
          du -sh "$OUT" || true
          ls -l "$OUT" || true

      - name: Разбить крупные DEX (API отдаёт файл целиком в base64)
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/apk-analysis"
          mkdir -p chunks
          shopt -s nullglob
          dexes=(*.dex)
          if [ ${#dexes[@]} -eq 0 ]; then
            echo "DEX нет — нечего делить"
            exit 0
          fi
          for f in "${dexes[@]}"; do
            size=$(stat -c%s "$f")
            echo "$f: $size байт"
            if [ "$size" -le 35000000 ]; then
              cp "$f" "chunks/$f"
            else
              split -b 35000000 -d -a 2 "$f" "chunks/${f}.part"
            fi
          done
          ls -l chunks/ | head -30

      - name: Закоммитить в ветку
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -R apk-analysis | head -40
          git add -A apk-analysis
          git status --short | head -20
          git diff --cached --quiet && { echo "изменений нет"; exit 0; }
          git commit -m "apk: извлечены DEX Apollon для статического анализа [skip ci]"
          set +e
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push && break
            echo "пуш $i не прошёл, повтор"; sleep 5
          done
          exit 0
