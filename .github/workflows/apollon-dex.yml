name: Apollon DEX extraction (static analysis input)
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/apollon-dex.yml', 'test-kit/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dex-zip:
    # Второй набор DEX: релиз `cheat` -> dex.zip. Из песочницы
    # release-assets.githubusercontent.com недоступен, поэтому качаем здесь
    # и коммитим в ветку, откуда читаем через api.github.com.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Скачать dex.zip из релиза cheat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/dex.zip \
            https://api.github.com/repos/gulp-tech/VoidAC/releases/assets/743903251
          ls -l /tmp/dex.zip
          file /tmp/dex.zip || true
          sha256sum /tmp/dex.zip || true

      - name: Распаковать и записать хэши
        run: |
          OUT="$GITHUB_WORKSPACE/apk-analysis/new-cheats"
          mkdir -p "$OUT"
          unzip -o -q /tmp/dex.zip -d "$OUT" || true
          echo "=== файлы ==="
          find "$OUT" -type f -printf '%s\t%p\n' | head -60
          ( cd "$OUT" && sha256sum $(find . -type f ! -name SHA256.txt) ) > "$OUT/SHA256.txt" 2>/dev/null || true
          cat "$OUT/SHA256.txt" || true

      - name: Закоммитить в ветку
        run: |
          git config user.name "vac-bot"
          git config user.email "bot@voidpe.local"
          git add -A apk-analysis/new-cheats
          if git diff --cached --quiet; then
            echo "нечего коммитить"
          else
            git commit -m "CI: dex.zip из релиза cheat [skip ci]"
            git push
          fi

  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Скачать APK Apollon (в Actions хост доступен)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/in
          gh release download cheat --repo gulp-tech/Purpurbedrock \
            --pattern 'MCPE_Apollon_Client_1.26.60_v6.71_64Bit.1.apk' --dir /tmp/in
          ls -l /tmp/in
          sha256sum /tmp/in/*.apk > /tmp/in/SHA256.txt

      - name: Извлечь DEX и манифест (только чтение, ничего не запускаем)
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/apk-analysis"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cd /tmp/in
          APK=$(ls *.apk | head -1)
          # Список содержимого архива — он же диагностика, если DEX не нашлись.
          unzip -l "$APK" > /tmp/in/listing.txt || true
          # DEX могут лежать и в корне, и без classes-префикса.
          unzip -o -q "$APK" '*.dex' 'AndroidManifest.xml' -d /tmp/dex || true
          # libReverseSigma.so — единственная библиотека с датой сборки 2026
          # (остальные от 2008), в ней и живёт код клиента.
          unzip -o -q "$APK" 'lib/arm64-v8a/libReverseSigma.so' -d /tmp/native || true
          ls -l /tmp/native/lib/arm64-v8a/ 2>/dev/null || true
          ls -l /tmp/dex 2>/dev/null || true
          cp /tmp/in/listing.txt /tmp/in/SHA256.txt "$OUT"/ || true
          if ls /tmp/dex/*.dex >/dev/null 2>&1; then
            cp -v /tmp/dex/*.dex "$OUT"/ || true
            cp -v /tmp/native/lib/arm64-v8a/libReverseSigma.so "$OUT"/ || true
          else
            echo "DEX не найдены — смотри listing.txt" > "$OUT"/README.txt
          fi
          du -sh "$OUT" || true
          ls -l "$OUT" || true

      - name: Разбить крупные DEX (API отдаёт файл целиком в base64)
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/apk-analysis"
          mkdir -p chunks
          shopt -s nullglob
          dexes=(*.dex)
          if [ ${#dexes[@]} -eq 0 ]; then
            echo "DEX нет — нечего делить"
            exit 0
          fi
          for f in "${dexes[@]}"; do
            size=$(stat -c%s "$f")
            echo "$f: $size байт"
            if [ "$size" -le 35000000 ]; then
              cp "$f" "chunks/$f"
            else
              split -b 35000000 -d -a 2 "$f" "chunks/${f}.part"
            fi
          done
          ls -l chunks/ | head -30

      - name: Закоммитить в ветку
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -R apk-analysis | head -40
          git add -A apk-analysis
          git status --short | head -20
          git diff --cached --quiet && { echo "изменений нет"; exit 0; }
          git commit -m "apk: извлечены DEX Apollon для статического анализа [skip ci]"
          git push
