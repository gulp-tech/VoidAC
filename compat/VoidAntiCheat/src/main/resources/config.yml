# ============================================================
#  VoidAntiCheat 2.0 — античит VoidPE ТОЛЬКО для Bedrock (Geyser/Floodgate)
#
#  Что изменилось в 2.0 (главная цель — НОЛЬ ложных жалоб):
#   • Улики вместо мгновенных штрафов. У каждой проверки есть буфер:
#     одно подозрительное событие не даёт VL. Повторы внутри
#     sample-gap весят вчетверо меньше, поэтому лаг-спайк с пачкой
#     пакетов не превращается в серию нарушений.
#   • Наказание требует: VL выше порога несколько секунд, несколько
#     разных проверок, нормальный пинг и TPS. По умолчанию автокик и
#     автобан ВЫКЛЮЧЕНЫ (auto-punish: false, punishments.commands: []).
#   • Компенсация лагов по джиттеру move-пакетов (пинг Bedrock через
#     Geyser часто 0). На шумном канале пороги растут, улика весит меньше.
#   • Широкие исключения: вода, паутина, порошковый снег, лёд, слизень,
#     мёд, сено, лестницы/лианы, леса, транспорт, элитра, Levitation,
#     Slow Falling, Riptide, поршни, взрывы, недавний урон, опора под
#     ногами (в т.ч. лодка/моб под игроком).
#   • Предсказание вертикали (гравитация/сопротивление) вместо «серий
#     по счётчику»: Fly ловится только при наборе > 3.4 блоков в воздухе
#     без прыжка/эффектов или зависании > 2 секунд. Jump Boost II (~2.6)
#     и спринт-прыжки Bedrock проходят.
#   • Совместимость с VoidPvP: плагин без кд атаки определяется сам, и
#     тогда сырой CPS не считается автокликером (только ровность кликов).
#   • Reach с перемоткой: удар сверяется с историей хитбокса цели,
#     допуск растёт от пинга, скорости цели и джиттера.
#
#  Режимы:
#   • settings.enforcement: false — вообще ничего не отменяет и не
#     телепортирует, только считает VL и пишет алерты (режим наблюдения).
#   • settings.auto-punish: false — кики/баны не выполняются.
#  Рекомендация на старт: оставить как есть, неделю смотреть алерты,
#  затем при желании включить auto-punish и добавить команды ниже.
# ============================================================

settings:
  enabled: true
  # Проверять только Bedrock/Floodgate. На этом сервере Java запрещена,
  # поэтому при недоступном Floodgate ниже есть безопасный fallback.
  bedrock-only: true
  # Если Floodgate API не нашлась: true = проверять всех (сервер Bedrock-only),
  # false = никого не проверять до установки Floodgate.
  check-all-if-floodgate-missing: true
  # --- Где античит молчит ---
  # Миры, имена которых поддерживают маски (пересобирать jar не нужно):
  #   world            точное имя
  #   arena-*          всё, что начинается с arena-
  #   *_test           всё, что заканчивается на _test
  #   lobby?           ? заменяет ровно один символ
  # Регистр не важен. Примеры:
  #   excluded-worlds: [arena-*, "_test", world_the_end]
  excluded-worlds: []
  # Обратный режим: проверять ТОЛЬКО эти миры (тоже с масками).
  # Пусто = проверяются все миры, кроме excluded-worlds.
  only-worlds: []
  excluded-worldguard-regions: []

  # --- Слои: детект → коррекция → наказание ---
  # false = только алерты и статистика, без cancel/setback.
  enforcement: true
  # true + punishments.commands = реальные кики/баны. По умолчанию выключено.
  auto-punish: false
  # true, если на сервере есть плагин без кд атаки (VoidPvP определяется сам):
  # тогда сырой CPS не считается автокликером, проверяется только ровность.
  fast-attack-server: false
  # Ядро Purpurbedrock отключает кулдаун атаки для Bedrock на уровне NMS
  # (gameplay-mechanics.bedrock-combat.enabled, по умолчанию true). Тогда
  # высокая частота ударов — штатная механика сервера, а не чит: сырой CPS
  # не считается автокликером, проверяется только ровность интервалов.
  # false — игнорировать настройку ядра и считать CPS как на Java.
  core-zero-attack-cooldown: true
  # Наказание только если VL держался выше порога столько секунд.
  punish-min-above-seconds: 20
  # Наказание только при нескольких активных проверках сразу.
  punish-min-distinct-checks: 2
  punish-max-ping: 400
  punish-min-tps: 17.0
  # Повторное наказание той же проверки не чаще, чем раз в N секунд.
  punish-cooldown-seconds: 60

  # Коррекция тоже требует устойчивости, а не одного выброса.
  setback-sustain-ms: 700
  cancel-sustain-ms: 250
  setback-cooldown-ms: 900
  cancel-cooldown-ms: 400

  # Как часто одна проверка может положить в буфер полную улику.
  # Более частые события весят x0.25.
  sample-gap-movement-ms: 220
  sample-gap-combat-ms: 120
  sample-gap-block-ms: 80

  # Ниже этого TPS проверки движения не штрафуют: сервер сам отстаёт.
  min-tps-for-movement: 16.0
  # Через сколько секунд чистой игры полностью сбрасываются VL и буферы.
  vl-reset-clean-seconds: 90

  # Грейсы после событий, которые легально меняют движение, миллисекунды.
  join-grace-ms: 3500
  teleport-grace-ms: 1750
  respawn-grace-ms: 3500
  world-change-grace-ms: 2500
  velocity-grace-ms: 900
  # Грейс, когда позиция сервера разошлась с ожидаемой (телепорт плагина,
  # коррекция ядра, вход в данж/зону RTP). Такое событие не считается
  # движением игрока вовсе, грейс — только чтобы не «догонять» его в следующем.
  unsynced-grace-ms: 600
  damage-grace-ms: 500
  piston-grace-ms: 1200
  piston-grace-radius: 4.0
  explosion-grace-ms: 1200
  explosion-grace-radius: 10.0
  riptide-grace-ms: 1500
  block-change-grace-ms: 1500

  # Дополнительный допуск специально для Bedrock-клиентов (Geyser/тач).
  bedrock-extra-tolerance: 0.04
  bedrock-reach-extra-blocks: 0.10

  # Алерты персоналу: кулдаун одинаковых алертов по игроку+проверке.
  alert-cooldown-ms: 2500
  alert-min-vl: 1.0
  log-console: true
  log-file: true
  staff-alerts: true
  debug: false

# ============================================================
#  Anti-ESP
#
#  Скрывает от клиента игроков, которых не должно быть видно: наблюдателей,
#  невидимых, слишком далёких. Это профилактика против ESP/Wallhack-паков
#  (Apollon/Horion/Toolbox), а НЕ доказательство чита: VL за это не начисляется.
#
#  ВАЖНО: в ядре Purpurbedrock уже есть свой Anti-ESP (плагин PurpurBedrockAC,
#  protection.anti-esp). Два владельца видимости = мигание игроков и лишние
#  пакеты. Поэтому по умолчанию модуль не запускается, если Anti-ESP ядра
#  активен. Хочешь вести его здесь — выключи его в ядре и поставь
#  only-if-core-inactive: false.
# ============================================================
anti-esp:
  # Выключено по умолчанию: включать ТОЛЬКО после проверки на живом клиенте.
  # Пока выключено, защиты от ESP и от базового детекта по сущностям нет.
  enabled: false
  # only-if-core-inactive: true — не запускаться, если ядро владеет видимостью
  # (у PurpurBedrockAC это protection.anti-esp.enabled). Два владельца
  # видимости дают мигание игроков, поэтому по умолчанию уступаем ядру.
  only-if-core-inactive: true

  # --- Уровень строгости ---
  # SOFT     — только то, что физически не должно быть видно: спектатор,
  #            невидимые, очень далёкие. Почти не влияет на картину мира.
  # BALANCED — плюс всё за сплошными блоками. ОСНОВНОЙ режим против ESP:
  #            убирает главный смысл чита (видеть сквозь стены).
  # STRICT   — плюс всё вне прямой видимости и вне радиуса боя. Максимум
  #            защиты, но возможны «пропадания» на сложном рельефе.
  level: BALANCED

  # Трассировка луча по блокам: именно она определяет «за стеной».
  # false = работать только по дистанции (дешевле, но почти бесполезно).
  trace-blocks: true
  # Дальше этого трассировка не выполняется: там работает дистанция.
  # Меньше = дешевле для сервера; 48 блоков достаточно для любого боя.
  trace-max-distance: 48

  # Радиус боя, в котором сущности НЕ скрываются: противник не должен
  # исчезать в момент удара, это ломает PvP и выглядит как баг.
  combat-radius: 6.0

  # Анти-дребезг: сколько проверок подряд нужно, чтобы спрятать/показать.
  # 2 при interval-ticks: 4 = смена состояния не чаще ~0.4 с.
  # Меньше = резче, но на границе видимости игрок может мигать.
  hide-after-samples: 2
  reveal-after-samples: 2

  # Как часто пересчитывать (тики). 4 = 5 раз в секунду: для ESP достаточно,
  # потому что позиции сущностей всё равно приходят пачками.
  interval-ticks: 4
  # Не трогать новых игроков первые N тиков (клиент грузит мир).
  join-grace-ticks: 60

  # Ближе этого не скрывать. 0 — не скрывать вблизи вообще.
  min-distance: 3.0
  # Дальше этого — скрывать.
  max-distance: 96.0

  hide-spectators: true
  hide-invisible: true

  # Не скрывать пассажиров и транспорт: клиент плохо перерисовывает
  # всадника, и это выглядит как вылетевший игрок.
  keep-vehicles: true
  # Не скрывать никого в радиусе боя (см. combat-radius).
  keep-in-combat: true
  # true = скрывать только за стенами, игнорируя уровень. Для отладки.
  hide-through-walls-only: false


# Компенсация сети. Джиттер считается по интервалам move-пакетов, потому
# что player.getPing() у Bedrock через Geyser часто равен 0.
compensation:
  # Если пинг неизвестен (Player.getPing() == 0 — обычное дело у Bedrock через
  # Geyser, и Geyser-сессия тоже недоступна), считать его таким, а не нулевым.
  # Ноль обнулял бы окно перемотки и допуск, то есть «неизвестно» наказывалось
  # бы строже, чем измеренный пинг.
  unknown-ping-assumed-ms: 120
  # Прибавка к допуску за каждые 100 мс пинга и её предел.
  ping-factor-per-100ms: 0.020
  max-ping-factor: 0.12
  # Прибавка за каждый мс джиттера и её предел.
  jitter-factor-per-ms: 0.0012
  max-jitter-factor: 0.30
  # Прибавка за каждый недостающий до 20 TPS пункт и её предел.
  tps-factor-per-point: 0.05
  max-tps-factor: 0.45
  # Интервал между пакетами больше этого = лаг-спайк.
  spike-interval-ms: 900
  # Сколько мс после спайка не применяем setback и режем улики.
  unstable-hold-ms: 2500

# Команды наказания. Выполняются от консоли при punish-vl проверки,
# НО только если settings.auto-punish: true и соблюдены все условия выше.
# Плейсхолдеры: %player%, %check%, %vl%, %max_vl%, %details%, %ping%, %tps%, %world%
# Пример (раскомментируй осознанно):
# punishments:
#   commands:
#     - "kick %player% VoidAntiCheat: подозрительная активность (%check%, VL %vl%)"
punishments:
  commands: []

# Необязательный Discord webhook по высоким VL. Пусто = выключено.
webhook:
  enabled: false
  url: ""
  min-vl: 10.0

movement:
  # Speed token bucket: разовый рывок допускается, улика — за устойчивый перерасход.
  speed-burst-blocks: 1.60
  speed-token-cap: 4.5
  # Пакет после паузы дольше этого — «наверстывание» после лага, не чит.
  speed-lag-skip-seconds: 0.60
  # Dolphin's Grace в воде разгоняет до ~9.6 бл/с.
  dolphins-grace-bps: 10.0
  # Множители допустимой скорости на льду.
  ice-factor: 1.70
  packed-ice-factor: 1.95
  blue-ice-factor: 2.35
  frosted-ice-factor: 1.45
  # Один move-пакет дальше этого без телепорта считается невозможным.
  teleport-delta-blocks: 24.0
  # Расхождение позиции сервера и пакета меньше этого (блоки) считается
  # синхронизацией, а не движением: Geyser иногда присылает позицию с
  # округлением, и это не должно давать улику.
  sync-epsilon-blocks: 0.08
  # Timer: position-движений к серверным тикам за окно.
  # Bedrock/Geyser может присылать пачки пакетов, поэтому порог высокий
  # (x1.5) и нужно 3 окна подряд: ложный Timer дороже пропущенного.
  timer-ratio: 1.50
  timer-extra-packets: 40
  timer-window-ticks: 100
  timer-windows: 3
  # Fly: предсказание вертикали. Jump Boost II даёт ~2.6 бл, поэтому порог 3.4.
  fly-ascent-blocks: 3.4
  # Серверное вертикальное velocity выше этого — подброс плагином/винд-чаржем/
  # riptide/поршнем: вертикальные проверки на время импульса отключаются.
  server-launch-velocity-y: 0.22
  fly-hover-ticks: 40
  # NoFall / Step / Jesus / Spider / NoClip.
  nofall-min-drop: 5.0
  nofall-server-fall-ratio: 0.30
  step-min-dy: 1.02
  jesus-ticks: 9
  climb-ticks: 10
  noclip-ticks: 4
  # Медленное падение (антигравитация) — серия тиков.
  slow-fall-ticks: 8

combat:
  # Дистанция от глаза до БЛИЖАЙШЕЙ точки хитбокса цели.
  reach-max-blocks: 3.45
  # На тач-вводе Bedrock серверная картина атаки чуть шумнее.
  reach-touch-max-blocks: 3.65
  # Дальше этого удар физически невозможен: отменяется (при enforcement).
  reach-hard-cancel-blocks: 4.80
  # Компенсация пинга атакующего и цели, блоков за 100 мс.
  reach-ping-comp-per-100ms: 0.045
  reach-ping-comp-max-blocks: 0.45
  # Компенсация движения цели: блоков на каждый бл/с её скорости.
  reach-move-comp-per-bps: 0.02
  reach-move-comp-max-blocks: 0.35
  # Окно перемотки хитбокса цели.
  reach-rewind-max-ms: 800
  # Предел общего множителя допуска reach от джиттера/TPS.
  reach-max-tolerance: 1.30
  # KillAura — только грубые серии, не одиночные удары.
  killaura-multi-targets: 5
  # На ядре с Bedrock-боёвкой (нулевой кд атаки + отключённый
  # Java-sweep) серия ударов по толпе мобов — штатная механика.
  # Порог поднимается только если ядро реально включает bedrock-combat.
  killaura-multi-targets-bedrock-combat: 9
  killaura-window-ms: 1000
  killaura-wall-min-distance: 1.90
  killaura-wall-max-ping: 320
  # AutoClicker. Удержание на тач-вводе даёт ровный ритм — это не чит,
  # поэтому ровность проверяется только для мыши/геймпада.
  autoclicker-cps: 24
  autoclicker-touch-cps: 27
  # Сколько окон подряд выше лимита нужно для улики.
  autoclicker-high-windows: 2
  autoclicker-consistent-min-cps: 26.0
  autoclicker-consistent-max-deviation-ms: 1.0
  autoclicker-sample-clicks: 32
  # Velocity/AntiKB: сверка ожидаемого нокбэка с фактическим перемещением.
  velocity-check-ticks: 5
  velocity-min-expected-blocks: 1.10
  velocity-min-travel-ratio: 0.30

world:
  fastbreak-per-second: 28
  fastbreak-same-tick: 4
  # Бур VoidEnchants ломает 3x3/3x3x2 серверным расширением: такие разрушения
  # не считаются отдельными действиями игрока. Источник — метка на предмете,
  # подделать её с клиента нельзя. Подробности — в блоке drill-exempt ниже.
  fastbreak-server-multiblock-exempt: true
  # --- Предсказание движения: ШАГ 1 (только измерения) ---
  #
  # Сейчас это НЕ проверка. Класс читает вертикальную скорость падения и
  # сравнивает с ванильной физикой (v.y -= 0.08; v.y *= 0.98), складывая
  # расхождения в статистику. Ни отмен, ни наказаний, ни улик — работает
  # даже при enforcement: false.
  #
  # Зачем: допуск в Boar (MIT) — 0.0001 блока, и он сам признаёт, что не
  # справляется с расхождением меньше 5.0E-5. На Bedrock с телефонами,
  # Geyser и прокси это почти наверняка даст массовые ложные откаты. Сначала
  # надо узнать реальное расхождение на ЭТОМ сервере: /vac predict <ник>
  # после 10–15 минут обычной игры без полётов и воды.
  #
  # Решение о шаге 2 принимается по цифрам, а не по обещаниям:
  #   медиана <= 0.002  -> физика верна, можно переходить к допуску;
  #   медиана <= 0.02   -> нужен допуск, предсказание в чистом виде не годится;
  #   медиана >  0.02   -> на этом сервере так работать не будет.
  prediction:
    measure: true
    # Вертикальное предсказание работает только для свободного падения.
    # Случаи вне зоны (опора, вода, элитра, левитация, транспорт) пропускаются.
  # --- Исключение для инструментов с серверным мультиблоком (бур) ---
  #
  # Любой такой инструмент создаёт 9–18 настоящих BlockBreakEvent за ОДИН тик
  # от имени одного игрока — для проверок это неотличимо от Nuker. Поэтому по
  # метке на предмете античит понимает, что блоки ломает серверное расширение,
  # и не считает их ни FastBreak, ни AutoMine, ни BlockReach.
  drill-exempt:
    # Полный выключатель. false = любые мультиблоки считаются обычным ломанием.
    enabled: true
    # Пространства имён меток (PDC). Пустой список = ЛЮБОЕ пространство имён,
    # и это правильный выбор: чар может жить в вашем плагине под любым именем.
    # Если хотите строгость — перечислите, например: [voidenchants, voiditems]
    namespaces: []
    # Имена ключей. Пустой список = любой ключ. Рекомендуется оставить пустым,
    # чтобы чар под другим именем не сломал исключение.
    keys: []
    # Запасной путь: имя предмета содержит подстроку (без учёта регистра и
    # цветов). Нужен, если уровень чара хранится не в PDC. Пусто = выключено.
    # Пример: ["Бур", "Drill"]
    name-contains: []
    # Потолок уровня из метки: защита от мусорных значений (9999).
    max-level: 5
    # Считать ли разрушения бура охотой за рудой (проверка AutoMine).
    # false = бур по руде не даёт улик AutoMine.
    exclude-from-automine: true
  fastplace-per-second: 28
  fastplace-same-tick: 4
  # Рука до блока: survival vanilla ~4.5, порог с Bedrock запасом.
  blockreach-max-blocks: 6.20
  blockreach-hard-cancel-blocks: 7.00
  # Scaffold: блоки строго под ногами на скорости, не крадучись и серией.
  scaffold-window-ms: 5000
  scaffold-places-in-window: 4
  scaffold-min-speed-bps: 3.0
  scaffold-max-pitch: 55.0

elytra:
  climb-dy-per-tick: 0.62
  climb-ticks: 6
  max-horizontal-bps: 118.0
  boost-grace-ms: 4000

vehicle:
  # Лодки на льду очень быстрые — отдельные лимиты по поверхности под лодкой.
  water-max-bps: 16.0
  ground-max-bps: 14.0
  ice-max-bps: 34.0
  packed-ice-max-bps: 40.0
  blue-ice-max-bps: 48.0
  burst-blocks: 3.0

# ---------------------------------------------------------------- добыча ресурсов
# AutoMine / Ore Scanner: клиент сам находит руду и ведёт прицел.
# Скорость при этом нормальная, поэтому улика не в скорости, а в том,
# ЧТО ломается и как выбирается цель.
automine:
  # Окно наблюдения, мс. Меньше — резче реакция, больше — надёжнее вывод.
  window-ms: 20000
  # Сколько разрушений нужно в окне, чтобы вообще делать вывод.
  min-blocks: 12
  # Какая доля разрушений должна быть рудой (0.85 = 85%).
  ore-ratio: 0.85
  # Сколько РАЗНЫХ видов руды нужно: бот берёт всё подряд.
  min-variety: 3
  # Серия блоков руды подряд без единого блока породы.
  streak: 6

# ------------------------------------------------------------------ бот-игрок
# MineBot: программа, играющая за игрока. Считается по трём признакам сразу:
# ровность интервалов, отсутствие простоев, стабильная реакция.
bot:
  enabled: true
  # Окно, мс. 30 секунд — чтобы живой человек успел отвлечься.
  window-ms: 30000
  # Минимум действий в окне: на малой выборке статистика не работает.
  min-actions: 30
  # Стандартное отклонение интервалов относительно среднего.
  # 0.06 = интервалы различаются не более чем на 6%. Человек даёт 25-60%.
  max-relative-deviation: 0.06
  # Доля пауз длиннее секунды. Бот не отвлекается — у него почти ноль.
  max-pause-share: 0.02

# --------------------------------------------------------- автоматическая постройка
# BuildPattern: автоматическая постройка по схеме (не Scaffold — тот под ноги).
buildpattern:
  # Время окна, мс.
  window-ms: 15000
  # Сколько установок хранить максимум.
  max-blocks: 48
  # Допуск на повтор смещения, блоки. Меньше — строже, но растут ложные.
  offset-tolerance: 0.5
  # Сколько раз подряд должно повториться одно смещение.
  repeats: 8

# Общие значения, если у конкретной проверки поле не задано.
# buffer — сколько очков улик нужно, чтобы получить первый VL.
# 2.5 при sample-gap 220 мс = примерно 3 устойчивых события.
