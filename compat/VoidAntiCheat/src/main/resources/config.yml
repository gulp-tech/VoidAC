messages:
  prefix: "&#FF5555VoidAC &8» &f"
  alert: "&c{player} &7подозрение на &f{check} &7VL &c{vl}&7/{max_vl} &8• &7{details} &8• &7пинг &f{ping}&7, джиттер &f{jitter}&7 мс, TPS &f{tps}"
  alert-hover: "&7Игрок: &f{player}\n&7Проверка: &f{check}\n&7VL: &c{vl}&7/{max_vl}\n&7{details}\n&8Клик — /vac info"
  no-permission: "&cТолько для администрации."
  player-not-found: "&cИгрок не найден."
  check-not-found: "&cНет такой проверки. Список: speed, fly, timer, nofall, step, jesus, spider, elytra, vehicle, velocity, reach, killaura, autoclicker, fastbreak, fastplace, scaffold, blockreach, badpackets, noclip, automine, minebot, buildpattern"
  reloaded: "&aVoidAntiCheat перезагружен."
  alerts-on: "&aАлерты VoidAntiCheat включены."
  alerts-off: "&cАлерты VoidAntiCheat выключены."
  reset-done: "&aVL игрока &f{player} &aсброшены{scope}."
  setback-done: "&aИгрок &f{player} &aвозвращён на последнюю безопасную точку."
  no-safe-location: "&cУ игрока нет сохранённой безопасной точки."
  status: "&7VoidAntiCheat: {state}&7, коррекция: &f{enforcement}&7, Bedrock/Floodgate: &f{floodgate}&7, игроков под наблюдением: &f{tracked}&7, TPS: &f{tps}"
  state-on: "&#7CFC00включён"
  state-off: "&cвыключен"
  info-header: "&f{player} &7— Bedrock: &f{bedrock}&7, ввод: &f{input}&7, устройство: &f{device}&7, пинг: &f{ping}"
  info-input: "&7Ввод: &f{kind} &8• &7платформа &f{platform}&7, режим &f{raw_input}&7, модель &f{model} &8• &7UI &f{ui} &8• &7источник &f{source} &8• &7{verdict}"
  info-lag: "&7Сеть: интервал &f{interval}&7 мс, джиттер &f{jitter}&7 мс, допуск &f{tolerance}&7x"
  info-none: "&7Активных VL нет."
  info-line: "&7{check}: &c{vl}&7/{max_vl} &8(буфер {buffer})"
  # Общая справка: /vac, /vac help и любой неизвестный ввод.
  help:
    - "&8&m        &r &fVoidAntiCheat &7— команды &8&m        "
    - "&f/vac &8— статус античита"
    - "&f/vac info &7<игрок> &8— VL, сеть, устройство, ввод"
    - "&f/vac alerts &8— вкл/выкл алерты себе"
    - "&f/vac reset &7<игрок> [проверка] &8— сбросить VL"
    - "&f/vac setback &7<игрок> &8— вернуть на безопасную точку"
    - "&f/vac check &7[проверка] [on|off] &8— вкл/выкл проверку на лету"
    - "&f/vac world &7list|add|remove|only|clear-only &8— миры исключений"
    - "&f/vac reload &8— перечитать config.yml"
    - "&f/vac help &7[команда] &8— эта справка / помощь по команде"

  # Строка «чего не хватает» перед справкой конкретной команды.
  usage-format: "&cНе хватает аргументов: &f{usage}"
  unknown-subcommand: "&cНеизвестная подкоманда: &f{sub}"

  # Краткое использование для сообщения usage.
  usage:
    info: "/vac info <игрок>"
    reset: "/vac reset <игрок> [проверка]"
    setback: "/vac setback <игрок>"
    check: "/vac check <проверка> [on|off]"
    world: "/vac world list|add|remove|only|clear-only [маска]"
    alerts: "/vac alerts"
    reload: "/vac reload"
    help: "/vac help [команда]"

  # Своя справка для каждой команды (/vac help <команда> и при нехватке аргументов).
  command:
    info:
      - "&f/vac info <игрок>"
      - "&7  VL и буферы по всем проверкам, пинг, джиттер, допуск,"
      - "&7  устройство и режим ввода игрока."
      - "&7  Право: &fvoidanticheat.admin"
    alerts:
      - "&f/vac alerts"
      - "&7  Включает или выключает алерты лично себе."
      - "&7  Право: &fvoidanticheat.admin"
    reset:
      - "&f/vac reset <игрок> [проверка]"
      - "&7  Без проверки — сбрасывает VL и буферы по всем проверкам."
      - "&7  С проверкой — только по одной (см. /vac check)."
      - "&7  Право: &fvoidanticheat.admin"
    setback:
      - "&f/vac setback <игрок>"
      - "&7  Возвращает игрока на последнюю безопасную точку."
      - "&7  Право: &fvoidanticheat.admin"
    check:
      - "&f/vac check [проверка] [on|off|status]"
      - "&7  Без аргументов — список всех 19 проверок."
      - "&7  С проверкой — её состояние; с on/off — переключение."
      - "&7  Переключение живёт до /vac reload (файл — источник правды)."
      - "&7  Право: &fvoidanticheat.admin"
    world:
      - "&f/vac world list &8— что сейчас в исключениях и whitelist"
      - "&f/vac world add <маска> &8— добавить мир в исключения"
      - "&f/vac world remove <маска> &8— убрать из исключений"
      - "&f/vac world only <маска...> &8— проверять только эти миры"
      - "&f/vac world clear-only &8— снять whitelist"
      - "&7  Маски: &fworld&7, &farena-*&7, &f*_test&7, &flobby?"
      - "&7  Изменения сразу пишутся в config.yml и применяются."
      - "&7  Право: &fvoidanticheat.admin"
    reload:
      - "&f/vac reload"
      - "&7  Перечитывает config.yml: пороги проверок, миры,"
      - "&7  Anti-ESP, компенсацию сети. VL и буферы не сбрасываются."
      - "&7  Право: &fvoidanticheat.admin"
    help:
      - "&f/vac help [команда]"
      - "&7  Без аргумента — общий список команд."
      - "&7  С аргументом — подробная справка по одной команде."
      - "&7  Право: &fvoidanticheat.admin"
